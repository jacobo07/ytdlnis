name: Fork sync and release

# Every day: merge the latest upstream (deniscerri/ytdlnis) into this fork's changes, and when the
# resulting version has not been released here yet, build it signed with the fork key and publish it
# as a release. The app's updater reads these releases.
#
# Version = upstream version, plus ".<fork revision>" when FORK_REVISION says the fork changed on top
# of that upstream version (see app/fork.gradle). A new upstream version resets the revision to 0.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and replace the APKs even if this version was already released"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge latest upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/deniscerri/ytdlnis.git
          git fetch --no-tags upstream main
          # fails the run (and GitHub emails you) if upstream changed the same lines as the fork
          git merge --no-edit upstream/main
          echo "UPSTREAM_SHA=$(git rev-parse upstream/main)" >> "$GITHUB_ENV"

      - name: Read version
        id: version
        run: |
          f=app/build.gradle
          read_def() { sed -nE "s/^def $1 = ([0-9a-z]+).*/\1/p" "$f" | head -n1; }
          base="$(read_def versionMajor).$(read_def versionMinor).$(read_def versionPatch)"
          build="$(read_def versionBuild)"
          if [ "${build:-0}" -gt 0 ]; then base="$base.$build"; fi
          beta=false
          if [ "$(read_def isBeta)" = "true" ]; then beta=true; fi
          upstream="$base"
          if [ "$beta" = "true" ]; then upstream="$base-beta"; fi

          # same rule as app/fork.gradle
          rev=0
          if [ -f FORK_REVISION ]; then
            IFS=: read -r rev_for rev_value < FORK_REVISION || true
            rev_for="$(echo "$rev_for" | tr -d '[:space:]')"
            rev_value="$(echo "$rev_value" | tr -d '[:space:]')"
            if [ "$rev_for" = "$upstream" ]; then rev="$rev_value"; fi
          fi
          v="$base"
          if [ "$rev" -gt 0 ]; then
            while [ "$(echo "$v" | tr -cd '.' | wc -c)" -lt 3 ]; do v="$v.0"; done
            v="$v.$rev"
          fi
          if [ "$beta" = "true" ]; then v="$v-beta"; fi

          tag="v$v"
          exists=false
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then exists=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$beta" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "Upstream $upstream, fork revision $rev, version $v, already released: $exists"

      - name: Set up JDK 17
        if: steps.version.outputs.exists == 'false' || inputs.force
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "corretto"
          cache: "gradle"

      - name: Configure keystore
        if: steps.version.outputs.exists == 'false' || inputs.force
        env:
          SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          KEYSTORE_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "Signing secrets are missing, refusing to publish an APK the installed app could not update to"
            exit 1
          fi
          # secrets set from Windows can carry \r and spaces, strip them before decoding
          printf '%s' "$SIGNING_KEY" | tr -d '\r\n\t ' | base64 -d > app/release_keystore.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" | tr -d '\r' > keystore.properties
          # fail here, not in Gradle, if the key and its password do not match
          pass="$(sed -nE 's/^signingConfig.storePassword=(.*)$/\1/p' keystore.properties)"
          keytool -list -keystore app/release_keystore.jks -storepass "$pass" > /dev/null
          touch local.properties
          chmod +x gradlew

      - name: Build signed APKs
        if: steps.version.outputs.exists == 'false' || inputs.force
        run: ./gradlew assembleGithubRelease

      - name: Publish release
        if: steps.version.outputs.exists == 'false' || inputs.force
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          apks=(app/build/outputs/apk/github/release/*.apk)
          ls -l "${apks[@]}"
          # the tag must be the version inside the APK, or the updater offers the same update forever
          for apk in "${apks[@]}"; do
            case "$(basename "$apk")" in
              "YTDLnis-$version-"*) ;;
              *) echo "APK $apk does not carry version $version"; exit 1 ;;
            esac
          done
          if [ "${{ steps.version.outputs.exists }}" = "true" ]; then
            gh release upload "$tag" "${apks[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            flags=()
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$tag" "${apks[@]}" "${flags[@]}" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "YTDLnis $version (fork)" \
              --notes "YTDLnis $version: upstream deniscerri/ytdlnis@${UPSTREAM_SHA} plus this fork's changes (YouTube sign in button with account status, switch account and sign out, sign in offered when a download needs it, Google sign in working in the webview, safer updater). Install the arm64-v8a APK on most phones."
          fi
